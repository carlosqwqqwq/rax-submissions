name: Temporary RAX Q1 QEMU campaign

on:
  push:
    branches:
      - infra/temporary-q1-qemu-20260909
    paths:
      - .github/workflows/temporary-q1-qemu.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive
  RAX_SOURCE_SHA: b18e91298adf72c7f7a17c1de0e87d7d65f4db28
  RAX_QEMU_CPU: rv64,v=true,vlen=128,elen=64,vext_spec=v1.0

jobs:
  smoke:
    name: RVV smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install frozen QEMU tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-user gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu
          qemu-riscv64 --version | tee qemu-version.txt
          grep -F 'version 8.2.2' qemu-version.txt
      - name: Compile and execute an RVV instruction stream
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/rax-q1-smoke
          mkdir -p "$out"
          cat > "$out/smoke.S" <<'EOF'
          .section .text
          .globl _start
          _start:
              vsetivli t0, 4, e32, m1, ta, ma
              vmv.v.i v1, 7
              li a0, 0
              li a7, 93
              ecall
          EOF
          riscv64-linux-gnu-gcc -nostdlib -static \
            -march=rv64gcv -mabi=lp64d \
            "$out/smoke.S" -o "$out/smoke.elf"
          riscv64-linux-gnu-objdump -d "$out/smoke.elf" \
            > "$out/objdump.txt"
          qemu-riscv64 -cpu "$RAX_QEMU_CPU" \
            -d in_asm -D "$out/trace.log" "$out/smoke.elf" \
            > "$out/console.log" 2>&1
          grep -E 'vsetivli|vmv\.v\.i' "$out/objdump.txt"
          grep -E 'vsetivli|vmv\.v\.i' "$out/trace.log"
          {
            echo "rax_source_sha=$RAX_SOURCE_SHA"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            uname -a
            qemu-riscv64 --version | head -n 2
            riscv64-linux-gnu-gcc --version | head -n 2
          } > "$out/environment.txt"
          sha256sum "$out"/* > "$out/SHA256SUMS"
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rax-q1-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/rax-q1-smoke
          if-no-files-found: error
          retention-days: 30

  boost_uuid:
    name: Boost.UUID public-entry replay
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Correct the copied Git revision expression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('temporary/q1/boost_uuid/run.py')
          text = path.read_text(encoding='utf-8')
          old = 'HEAD^{{tree}}'
          new = 'HEAD^{tree}'
          if text.count(old) == 1:
              path.write_text(text.replace(old, new), encoding='utf-8')
          elif old in text or new not in text:
              raise SystemExit('unexpected Boost.UUID revision-expression state')
          PY
          if ! git diff --quiet -- temporary/q1/boost_uuid/run.py; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add temporary/q1/boost_uuid/run.py
            git commit -m "fix(qemu): correct Boost.UUID tree identity expression"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Install frozen QEMU tools and Boost headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git qemu-user g++-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu libc6-dev-riscv64-cross \
            libboost-dev
          qemu-riscv64 --version | tee qemu-version.txt
          grep -F 'version 8.2.2' qemu-version.txt
      - name: Run the frozen replay package
        run: |
          python temporary/q1/boost_uuid/run.py \
            --output /tmp/rax-q1-boost-uuid
      - name: Record source identity
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/rax-q1-boost-uuid
          {
            echo "rax_source_sha=$RAX_SOURCE_SHA"
            echo "public_runner_commit=$(git rev-parse HEAD)"
            echo "public_runner_sha256=$(sha256sum temporary/q1/boost_uuid/run.py | cut -d' ' -f1)"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
          } > /tmp/rax-q1-boost-uuid/rax-source.txt
      - name: Upload Boost.UUID evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rax-q1-boost-uuid-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/rax-q1-boost-uuid
          if-no-files-found: error
          retention-days: 30

  libjpeg:
    name: libjpeg-turbo independent rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install frozen QEMU and build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git qemu-user gcc-riscv64-linux-gnu g++-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu libc6-dev-riscv64-cross \
            cmake ninja-build clang lld
          qemu-riscv64 --version | tee qemu-version.txt
          grep -F 'version 8.2.2' qemu-version.txt
      - name: Build, test, activate and measure the frozen pair
        run: |
          python temporary/q1/libjpeg_public.py \
            --output /tmp/rax-q1-libjpeg
      - name: Upload public evidence and private-check package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rax-q1-libjpeg-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/rax-q1-libjpeg
          if-no-files-found: error
          retention-days: 30
